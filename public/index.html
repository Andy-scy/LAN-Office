<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAN Office · 局域网多人协同办公</title>
<script>
/* 设备识别：UA + 触屏兜底，绘制前写入 <html data-device>，CSS 据此切换三套 UI；?ui= 可强制覆盖 */
(function () {
  var ua = navigator.userAgent || '';
  var k = 'desktop';
  try {
    var q = new URLSearchParams(location.search).get('ui');
    if (q === 'mobile' || q === 'tablet' || q === 'desktop') {
      k = q;
    } else if (/iPad|Tablet|PlayBook|Silk/i.test(ua) || (/Android/i.test(ua) && !/Mobile/i.test(ua)) || (navigator.maxTouchPoints > 1 && /Macintosh/i.test(ua))) {
      k = 'tablet';
    } else if (/Mobi|iPhone|Windows Phone/i.test(ua) || (/Android/i.test(ua) && /Mobile/i.test(ua))) {
      k = 'mobile';
    } else if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 820) {
      k = Math.min(screen.width, screen.height) < 520 ? 'mobile' : 'tablet';
    }
  } catch (e) { /* 保持 desktop */ }
  document.documentElement.dataset.device = k;
})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234F46E5'/%3E%3Ctext x='16' y='22.5' font-size='15' font-family='Segoe UI,sans-serif' font-weight='700' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">

<body>
<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true">

    </div>

    </div>
  </div>
  <div class="top-status">
    <span class="status-item" id="chip-server" title="局域网访问地址">…</span>
    <span class="status-item status-ds" id="chip-ds" title="OnlyOffice 编辑引擎状态"><i class="dot"></i><span>编辑引擎</span></span>
    <span class="status-item" id="chip-online">…</span>
    <span class="status-item" id="chip-files">…</span>
  </div>
  <nav class="top-actions">
    <a class="nav-btn" href="/surveys.html" title="创建问卷、填写与查看统计">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6"/><path d="M9 16h4"/></svg>
      <span>问卷</span>
    </a>
    <a class="nav-btn" id="chip-admin" href="/admin.html" hidden title="分组、可见性与文件归组">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>管理面板</span>
    </a>
    <button class="nav-btn" id="chip-role" hidden></button>
    <button class="user-btn" id="chip-user" title="点击修改昵称与设备名称">…</button>
  </nav>
</header>

<main class="wrap">
  <section class="toolbar">
    <button id="btn-upload" class="btn primary">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
      上传文件
    </button>
    <input type="file" id="file-input" multiple hidden
      accept=".docx,.doc,.xlsx,.xls,.pptx,.ppt,.odt,.ods,.odp,.csv,.txt,.pdf">
    <div class="btn-group">
      <button id="btn-new" class="btn">＋ 新建</button>
      <div class="menu" id="menu-new" hidden>
        <button data-ext="docx"><span class="mi word">W</span>Word 文档 (.docx)</button>
        <button data-ext="xlsx"><span class="mi excel">X</span>Excel 表格 (.xlsx)</button>
        <button data-ext="pptx"><span class="mi ppt">P</span>PowerPoint 演示 (.pptx)</button>
      </div>
    </div>
    <input id="search" type="search" placeholder="搜索文件名…" autocomplete="off">
    <div class="upload-progress" id="upload-progress" hidden>
      <div class="bar"><i></i></div><span>0%</span>
    </div>
  </section>

  <section class="files" id="files" aria-live="polite"></section>

  <section class="empty" id="empty" hidden>
    <svg class="empty-icon" viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="#c3c8d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
    <h2>还没有文件</h2>
    <p>上传 Word / Excel / PowerPoint 文件，或直接新建一个空白文档。<br>同一局域网的设备打开同一文件即可多人协同编辑。</p>
  </section>

  <p class="foot-hint" id="foot-hint"></p>
</main>

<div class="drop-overlay" id="drop-overlay" hidden>
  <div class="drop-box">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
    松开鼠标，上传文件
  </div>
</div>
<button class="fab" id="fab-upload" aria-label="上传文件" title="上传文件">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
  <span>上传</span>
</button>
